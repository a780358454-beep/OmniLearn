name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Analyze Code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Build Release APKs (Split per ABI)
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build failure as issue
        if: failure()
        run: |
          {
            echo "Commit: ${{ github.sha }}"
            echo
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/build.log" || echo "no build log produced"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          jq -Rs --arg title "CI build failed #${{ github.run_number }}" '{title:$title, body:.}' < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/payload.json"
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @"$RUNNER_TEMP/payload.json"

      - name: Publish Release with APKs
        uses: softprops/action-gh-release@v2
        if: success() && startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "OmniLearn Release v1.0.${{ github.run_number }}"
          body: "Official Android Release builds for OmniLearn Core Engine."
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
